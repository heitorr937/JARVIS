
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>JARVIS</title>

    <style>
        body {
            width: 250px;
            padding: 15px;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
        }

        h2 {
            text-align: center;
            color: #00bfff;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 9px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #ativar {
            background: #008cff;
            color: white;
        }

        #desativar {
            background: #333f4b;
            color: white;
        }

        #status {
            margin-top: 14px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>JARVIS</h2>

    <button id="ativar">Ativar nesta aba</button>
    <button id="desativar">Desativar</button>

    <div id="status">Aguardando comando...</div>

    <script src="popup.js"></script>
</body>
</html>
